apiVersion: apps/v1
kind: Deployment
metadata:
  name: blood-bank-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blood-bank-app
  template:
    metadata:
      labels:
        app: blood-bank-app
    spec:
      containers:
      - name: blood-bank
        image: apsanadevops/bloodbank:appimg    
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: blood-bank-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
          readinessProbe:  #### Probe isnot working ###
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
