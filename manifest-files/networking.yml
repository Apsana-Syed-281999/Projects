apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blood-bank-network-policy
spec:
  podSelector:
    matchLabels:
      app: blood-bank-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    #Allow traffic from ingress
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
    ports:
    - protocol: TCP
      port: 80

  egress:
  - to:
    - podSelector:
        matchLabels:
        app: blood-bank-db
    ports:
    - protocol: TCP
      port: 3306
 
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
      
